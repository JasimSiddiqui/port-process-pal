[package]
name = "port-process-pal"
version = "1.0.0"
description = "List, inspect, and kill the processes holding your local ports."
authors = ["Jasim Siddiqui"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "ppp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
